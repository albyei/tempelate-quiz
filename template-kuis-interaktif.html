<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Template Kuis Interaktif</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class' };
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  .custom-scrollbar::-webkit-scrollbar { width: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  @keyframes popIn { from { transform: scale(.9); opacity:0 } to { transform: scale(1); opacity:1 } }
  .pop-in { animation: popIn .18s ease-out; }
  kbd { background:#e2e8f0; border-radius:4px; padding:1px 5px; font-size:10px; font-family:inherit; }
  .dark kbd { background:#334155; color:#e2e8f0; }
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen flex flex-col transition-colors">

<header class="bg-indigo-700 dark:bg-indigo-900 text-white shadow-lg sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
    <div class="flex items-center space-x-3">
      <i class="fa-solid fa-graduation-cap text-2xl text-indigo-200"></i>
      <div>
        <h1 id="quiz-title" class="font-bold text-lg leading-tight">Judul Kuis</h1>
        <p id="quiz-subtitle" class="text-xs text-indigo-200">Subjudul kuis</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div class="text-right">
        <span class="text-xs block text-indigo-200"><i class="fa-regular fa-clock"></i> Waktu</span>
        <span id="timer-display" class="font-bold text-sm">00:00</span>
      </div>
      <div class="text-right">
        <span class="text-xs block text-indigo-200">Skor</span>
        <span id="score-display" class="font-bold text-lg">0 / 0</span>
      </div>
      <button id="darkmode-toggle" title="Mode gelap/terang" class="bg-indigo-600 hover:bg-indigo-800 dark:bg-indigo-700 w-8 h-8 rounded-lg transition flex items-center justify-center border border-indigo-400">
        <i class="fa-solid fa-moon text-sm"></i>
      </button>
      <button id="reset-btn" class="bg-indigo-600 hover:bg-indigo-800 dark:bg-indigo-700 text-xs px-3 py-1.5 rounded-lg transition flex items-center gap-1 border border-indigo-400">
        <i class="fa-solid fa-rotate-right"></i> Reset
      </button>
    </div>
  </div>
  <div class="h-1.5 bg-indigo-900/40 dark:bg-black/30">
    <div id="progress-bar" class="h-1.5 bg-emerald-400 transition-all duration-300" style="width:0%"></div>
  </div>
</header>

<div class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-6">

  <!-- Sidebar -->
  <aside class="lg:col-span-1 bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 h-fit lg:sticky lg:top-24">
    <h2 class="font-semibold text-slate-700 dark:text-slate-200 mb-3 text-sm uppercase tracking-wider flex items-center gap-2">
      <i class="fa-solid fa-list-ol text-indigo-600 dark:text-indigo-400"></i> Navigasi Soal
    </h2>

    <div class="mb-3">
      <label class="text-xs text-slate-500 dark:text-slate-400 mb-1 block">Bagian:</label>
      <select id="section-select" class="w-full text-xs p-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-900 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"></select>
    </div>

    <div class="mb-3">
      <label class="text-xs text-slate-500 dark:text-slate-400 mb-1 block">Status:</label>
      <select id="status-select" class="w-full text-xs p-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-900 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        <option value="all">Semua Status</option>
        <option value="unanswered">Belum Dijawab</option>
        <option value="wrong">Jawaban Salah</option>
        <option value="correct">Jawaban Benar</option>
        <option value="bookmarked">Ditandai</option>
      </select>
    </div>

    <div class="mb-3 flex gap-2">
      <input id="jump-input" type="number" min="1" placeholder="No. soal" class="w-full text-xs p-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-900 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      <button id="jump-btn" class="shrink-0 px-3 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-lg text-xs font-medium">Lompat</button>
    </div>

    <button id="shuffle-btn" class="w-full mb-3 text-xs px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 transition flex items-center justify-center gap-2">
      <i class="fa-solid fa-shuffle"></i> <span id="shuffle-label">Acak Urutan Soal</span>
    </button>

    <div id="number-grid" class="grid grid-cols-5 gap-1.5 max-h-72 overflow-y-auto p-1 custom-scrollbar"></div>

    <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-700 flex flex-wrap gap-2 text-[10px] text-slate-500 dark:text-slate-400">
      <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-full inline-block"></span> Belum</span>
      <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 bg-emerald-500 rounded-full inline-block"></span> Benar</span>
      <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 bg-rose-500 rounded-full inline-block"></span> Salah</span>
      <span class="flex items-center gap-1"><i class="fa-solid fa-star text-amber-400"></i> Ditandai</span>
    </div>

    <button id="result-btn" class="w-full mt-4 text-xs px-3 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white transition flex items-center justify-center gap-2">
      <i class="fa-solid fa-chart-simple"></i> Lihat Hasil
    </button>
  </aside>

  <!-- Main -->
  <main class="lg:col-span-3 flex flex-col gap-4">
    <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 flex-1 flex flex-col justify-between">
      <div>
        <div class="flex justify-between items-start gap-4 mb-4">
          <span id="question-category" class="bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 text-xs font-semibold px-2.5 py-1 rounded-md border border-indigo-100 dark:border-indigo-800">Bagian</span>
          <div class="flex items-center gap-3">
            <span id="question-number-tag" class="text-xs font-medium text-slate-400 dark:text-slate-500">Soal 1 dari 1</span>
            <button id="bookmark-btn" title="Tandai untuk ditinjau (B)" class="text-slate-300 dark:text-slate-600 hover:text-amber-400 transition text-lg">
              <i class="fa-regular fa-star"></i>
            </button>
          </div>
        </div>

        <h3 id="question-text" class="text-base lg:text-lg font-medium text-slate-800 dark:text-slate-100 mb-6 leading-relaxed">Memuat...</h3>

        <div id="options-container" class="space-y-3 mb-6"></div>
      </div>

      <div id="discussion-box" class="hidden mt-4 p-4 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm pop-in">
        <div class="font-semibold text-slate-700 dark:text-slate-200 mb-1 flex items-center gap-2">
          <i class="fa-solid fa-circle-info text-indigo-600 dark:text-indigo-400"></i> Pembahasan:
        </div>
        <p id="discussion-text" class="text-slate-600 dark:text-slate-300 leading-relaxed"></p>
      </div>

      <div class="flex justify-between items-center mt-6 pt-4 border-t border-slate-100 dark:border-slate-700">
        <button id="prev-btn" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-200 font-medium text-sm rounded-lg transition flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
          <i class="fa-solid fa-arrow-left"></i> Sebelumnya
        </button>
        <span class="hidden md:block text-[11px] text-slate-400 dark:text-slate-500"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> pindah &nbsp; <kbd>1-4</kbd> pilih &nbsp; <kbd>B</kbd> tandai</span>
        <button id="next-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-lg transition flex items-center gap-2">
          Selanjutnya <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </div>
  </main>
</div>

<!-- Result Modal -->
<div id="result-overlay" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white dark:bg-slate-800 rounded-xl shadow-xl max-w-lg w-full max-h-[85vh] overflow-y-auto custom-scrollbar pop-in">
    <div class="p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100"><i class="fa-solid fa-chart-simple text-indigo-600 dark:text-indigo-400"></i> Hasil Latihan</h2>
        <button id="result-close" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div class="text-center mb-5">
        <div id="result-score" class="text-4xl font-extrabold text-indigo-600 dark:text-indigo-400">0 / 0</div>
        <div id="result-percentage" class="text-sm text-slate-500 dark:text-slate-400 mt-1">0% benar &middot; waktu 00:00</div>
      </div>
      <div class="mb-5">
        <h3 class="text-xs font-semibold uppercase text-slate-500 dark:text-slate-400 mb-2">Per Bagian</h3>
        <table class="w-full text-sm"><tbody id="result-breakdown"></tbody></table>
      </div>
      <div>
        <h3 class="text-xs font-semibold uppercase text-slate-500 dark:text-slate-400 mb-2">Soal yang Perlu Ditinjau</h3>
        <div id="result-wrong-list" class="flex flex-wrap gap-1.5"></div>
      </div>
      <div class="flex gap-2 mt-6">
        <button id="result-restart" class="flex-1 px-4 py-2 bg-rose-50 dark:bg-rose-950 text-rose-600 dark:text-rose-300 hover:bg-rose-100 dark:hover:bg-rose-900 rounded-lg text-sm font-medium transition">Ulangi dari Awal</button>
        <button id="result-close-2" class="flex-1 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition">Lanjut Meninjau</button>
      </div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   1) GANTI HANYA BAGIAN INI UNTUK MEMBUAT KUIS TOPIK BARU
   - QUIZ_META: judul & subjudul yang tampil di header
   - questionsData: array soal dengan skema tetap sama persis:
     { id, section, sectionName, question, options[], answer, discussion }
   - Nama/urutan bagian (section, sectionName) otomatis terdeteksi,
     jadi dropdown "Bagian" TIDAK perlu diedit manual.
   ===================================================================== */
const QUIZ_META = {
  title: "Latihan Soal Database",
  subtitle: "100 Soal Interaktif Perancangan, Normalisasi, & SQL"
};

const questionsData = [
  { id: 1, section: 1, sectionName: "Bagian 1: Database Design & Relasi Tabel",
    question: "Apa tujuan utama dari perancangan/desain database yang baik?",
    options: ["Mempercepat proses instalasi MySQL","Mengurangi duplikasi data (redundancy) dan menjaga integritas data","Memastikan semua kolom bertipe VARCHAR","Menyimpan semua data dalam satu tabel besar agar mudah dibaca"],
    answer: 1, discussion: "Tujuan utama desain database adalah mengurangi duplikasi data (redundancy) serta menjaga integritas data agar tetap konsisten dan akurat." },
  { id: 2, section: 1, sectionName: "Bagian 1: Database Design & Relasi Tabel",
    question: "Pada relasi 1:1 antara tabel users dan user_profiles, atribut apa yang harus ditambahkan pada foreign key user_id di tabel user_profiles?",
    options: ["AUTO_INCREMENT","NOT NULL saja","UNIQUE","PRIMARY KEY ganda"],
    answer: 2, discussion: "Atribut UNIQUE pada foreign key memastikan bahwa satu baris data hanya bisa berpasangan dengan tepat satu baris data di tabel lain (relasi 1:1)." },
  { id: 3, section: 1, sectionName: "Bagian 1: Database Design & Relasi Tabel",
    question: "Manakah contoh kasus dunia nyata yang paling tepat menggambarkan relasi 1 : N (One-to-Many)?",
    options: ["Mahasiswa dengan Mata Kuliah","Negara dengan Bendera Nasional","Dosen Pengampu dengan Mata Kuliah yang Diampu","Pengguna dengan Nomor KTP"],
    answer: 2, discussion: "Satu dosen bisa mengampu banyak mata kuliah, tetapi dalam satu kelas mata kuliah spesifik diampu oleh satu dosen utama (1 : N)." }
  /* ... tambahkan sisa soal dengan skema yang sama di sini ...
     Contoh format prompt ke AI untuk generate soal baru ada di catatan
     penjelasan yang menyertai file ini. */
];
/* =====================================================================
   2) JANGAN UBAH KODE DI BAWAH INI — mesin kuis bersifat generik
   ===================================================================== */

// ---------- Storage (localStorage dengan fallback ke memori) ----------
function hashData(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h<<5)-h+str.charCodeAt(i); h|=0; } return Math.abs(h).toString(36); }
const QUIZ_ID = hashData(QUIZ_META.title + questionsData.length + (questionsData[0]?.question || ''));
const STORAGE_KEY = `quizapp_v1_${QUIZ_ID}`;
let memoryState = null;
let storageAvailable = true;

function defaultState(){
  return { answers:{}, bookmarks:[], currentId: questionsData[0]?.id ?? null, filterSection:'all', filterStatus:'all', elapsed:0, dark:false, shuffled:false, order:null };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ storageAvailable = false; }
  return memoryState || defaultState();
}
function saveState(){
  memoryState = state;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ storageAvailable = false; }
}

let state = Object.assign(defaultState(), loadState());
if(!questionsData.find(q => q.id === state.currentId)) state.currentId = questionsData[0]?.id ?? null;

// ---------- DOM refs ----------
const $ = id => document.getElementById(id);
const els = {
  title: $('quiz-title'), subtitle: $('quiz-subtitle'),
  score: $('score-display'), timer: $('timer-display'), progressBar: $('progress-bar'),
  darkToggle: $('darkmode-toggle'), resetBtn: $('reset-btn'),
  sectionSelect: $('section-select'), statusSelect: $('status-select'),
  jumpInput: $('jump-input'), jumpBtn: $('jump-btn'),
  shuffleBtn: $('shuffle-btn'), shuffleLabel: $('shuffle-label'),
  numberGrid: $('number-grid'), resultBtn: $('result-btn'),
  category: $('question-category'), numberTag: $('question-number-tag'),
  bookmarkBtn: $('bookmark-btn'), questionText: $('question-text'),
  optionsContainer: $('options-container'),
  discussionBox: $('discussion-box'), discussionText: $('discussion-text'),
  prevBtn: $('prev-btn'), nextBtn: $('next-btn'),
  overlay: $('result-overlay'), resultClose: $('result-close'), resultClose2: $('result-close-2'),
  resultScore: $('result-score'), resultPercentage: $('result-percentage'),
  resultBreakdown: $('result-breakdown'), resultWrongList: $('result-wrong-list'),
  resultRestart: $('result-restart')
};

// ---------- Helpers ----------
function orderedQuestions(){
  if(state.shuffled && state.order){
    return state.order.map(id => questionsData.find(q => q.id === id)).filter(Boolean);
  }
  return questionsData;
}
function sectionsList(){
  const map = new Map();
  questionsData.forEach(q => { if(!map.has(q.section)) map.set(q.section, q.sectionName); });
  return [...map.entries()].sort((a,b) => a[0]-b[0]);
}
function matchesStatus(q){
  const answered = state.answers.hasOwnProperty(q.id);
  switch(state.filterStatus){
    case 'unanswered': return !answered;
    case 'wrong': return answered && state.answers[q.id] !== q.answer;
    case 'correct': return answered && state.answers[q.id] === q.answer;
    case 'bookmarked': return state.bookmarks.includes(q.id);
    default: return true;
  }
}
function filteredList(){
  return orderedQuestions().filter(q =>
    (state.filterSection === 'all' || q.section == state.filterSection) && matchesStatus(q)
  );
}
function currentQuestion(){ return questionsData.find(q => q.id === state.currentId); }
function fmtTime(sec){
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  const pad = n => String(n).padStart(2,'0');
  return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

// ---------- Rendering ----------
function renderMeta(){
  els.title.textContent = QUIZ_META.title;
  els.subtitle.textContent = QUIZ_META.subtitle;
  document.title = QUIZ_META.title;
}
function renderSectionSelect(){
  els.sectionSelect.innerHTML = '<option value="all">Semua Bagian</option>' +
    sectionsList().map(([num,name]) => `<option value="${num}">${name}</option>`).join('');
  els.sectionSelect.value = state.filterSection;
  els.statusSelect.value = state.filterStatus;
}
function renderProgressAndScore(){
  const total = questionsData.length;
  const answeredCount = Object.keys(state.answers).length;
  let correct = 0;
  questionsData.forEach(q => { if(state.answers[q.id] === q.answer) correct++; });
  els.score.textContent = `${correct} / ${total}`;
  els.progressBar.style.width = `${total ? (answeredCount/total*100) : 0}%`;
}
function renderNumberGrid(){
  const list = orderedQuestions().filter(q => state.filterSection === 'all' || q.section == state.filterSection);
  els.numberGrid.innerHTML = '';
  list.forEach(q => {
    const btn = document.createElement('button');
    btn.innerText = q.id;
    const answered = state.answers.hasOwnProperty(q.id);
    const isCorrect = answered && state.answers[q.id] === q.answer;
    const isBookmarked = state.bookmarks.includes(q.id);
    const dim = !matchesStatus(q);
    let cls = "relative h-8 text-xs font-semibold rounded transition flex items-center justify-center ";
    if(q.id === state.currentId) cls += "ring-2 ring-indigo-600 ring-offset-1 dark:ring-offset-slate-800 ";
    if(answered) cls += isCorrect ? "bg-emerald-500 text-white " : "bg-rose-500 text-white ";
    else cls += "bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 ";
    if(dim) cls += "opacity-30 ";
    btn.className = cls;
    if(isBookmarked){
      const star = document.createElement('i');
      star.className = "fa-solid fa-star text-amber-400 absolute -top-1 -right-1 text-[8px]";
      btn.appendChild(document.createTextNode(''));
      btn.appendChild(star);
    }
    btn.addEventListener('click', () => { state.currentId = q.id; saveState(); renderAll(); });
    els.numberGrid.appendChild(btn);
  });
}
function renderQuestion(){
  const q = currentQuestion();
  if(!q){ els.questionText.textContent = "Tidak ada soal untuk ditampilkan."; els.optionsContainer.innerHTML=''; return; }
  els.category.textContent = q.sectionName;
  const list = orderedQuestions();
  const posInAll = list.findIndex(x => x.id === q.id) + 1;
  els.numberTag.textContent = `Soal ${q.id} (${posInAll} dari ${list.length})`;
  els.questionText.textContent = `${q.id}. ${q.question}`;

  const isBookmarked = state.bookmarks.includes(q.id);
  els.bookmarkBtn.innerHTML = isBookmarked ? '<i class="fa-solid fa-star"></i>' : '<i class="fa-regular fa-star"></i>';
  els.bookmarkBtn.className = "text-lg transition " + (isBookmarked ? "text-amber-400" : "text-slate-300 dark:text-slate-600 hover:text-amber-400");

  const isAnswered = state.answers.hasOwnProperty(q.id);
  const selected = state.answers[q.id];

  els.optionsContainer.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    let cls = "w-full p-3.5 rounded-lg border text-sm font-medium transition flex items-start ";
    if(!isAnswered){
      cls += "border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 hover:border-indigo-500 hover:bg-indigo-50/50 dark:hover:bg-indigo-950/40 text-slate-700 dark:text-slate-200";
    } else if(idx === q.answer){
      cls += "border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-300 font-semibold";
    } else if(idx === selected){
      cls += "border-rose-500 bg-rose-50 dark:bg-rose-950/40 text-rose-800 dark:text-rose-300 font-semibold";
    } else {
      cls += "border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-400 dark:text-slate-500 opacity-60";
    }
    btn.className = cls;
    const label = String.fromCharCode(97 + idx);
    btn.innerHTML = `<span class="font-bold uppercase mr-2 text-xs w-5 h-5 rounded-full border border-current inline-flex items-center justify-center shrink-0">${label}</span><span class="text-left">${opt}</span>`;
    if(!isAnswered) btn.addEventListener('click', () => selectOption(q.id, idx));
    els.optionsContainer.appendChild(btn);
  });

  if(isAnswered){
    els.discussionBox.classList.remove('hidden');
    els.discussionText.textContent = q.discussion;
  } else {
    els.discussionBox.classList.add('hidden');
  }

  const flist = filteredList();
  const fIdx = flist.findIndex(x => x.id === q.id);
  els.prevBtn.disabled = fIdx <= 0;
  els.nextBtn.innerHTML = (fIdx === flist.length - 1) ? 'Lihat Hasil <i class="fa-solid fa-flag-checkered"></i>' : 'Selanjutnya <i class="fa-solid fa-arrow-right"></i>';
}
function renderAll(){
  renderProgressAndScore();
  renderNumberGrid();
  renderQuestion();
  saveState();
}

// ---------- Actions ----------
function selectOption(qId, idx){
  state.answers[qId] = idx;
  renderAll();
}
function toggleBookmark(){
  const q = currentQuestion(); if(!q) return;
  const pos = state.bookmarks.indexOf(q.id);
  if(pos === -1) state.bookmarks.push(q.id); else state.bookmarks.splice(pos,1);
  renderAll();
}
function navigate(direction){
  const flist = filteredList();
  const idx = flist.findIndex(q => q.id === state.currentId);
  const newIdx = idx + direction;
  if(newIdx >= 0 && newIdx < flist.length){
    state.currentId = flist[newIdx].id;
    renderAll();
  } else if(newIdx >= flist.length){
    openResultModal();
  }
}
function jumpToNumber(num){
  const q = questionsData.find(x => x.id === num);
  if(q){ state.currentId = q.id; renderAll(); }
}
function toggleShuffle(){
  state.shuffled = !state.shuffled;
  if(state.shuffled && !state.order){
    const ids = questionsData.map(q => q.id);
    for(let i = ids.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
    state.order = ids;
  }
  els.shuffleLabel.textContent = state.shuffled ? "Urutan Asli" : "Acak Urutan Soal";
  renderAll();
}
function toggleDark(){
  state.dark = !state.dark;
  document.documentElement.classList.toggle('dark', state.dark);
  saveState();
}
function resetQuiz(){
  if(confirm("Yakin ingin mengulang latihan dari awal? Semua jawaban akan dihapus.")){
    const dark = state.dark;
    state = defaultState();
    state.dark = dark;
    saveState();
    renderSectionSelect();
    renderAll();
    closeResultModal();
  }
}

// ---------- Result modal ----------
function openResultModal(){
  const total = questionsData.length;
  const answeredCount = Object.keys(state.answers).length;
  let correct = 0;
  const wrongIds = [];
  questionsData.forEach(q => {
    if(state.answers.hasOwnProperty(q.id)){
      if(state.answers[q.id] === q.answer) correct++; else wrongIds.push(q.id);
    }
  });
  els.resultScore.textContent = `${correct} / ${total}`;
  const pct = total ? Math.round(correct/total*100) : 0;
  els.resultPercentage.textContent = `${pct}% benar dari ${answeredCount} soal dijawab \u00b7 waktu ${fmtTime(state.elapsed)}`;

  els.resultBreakdown.innerHTML = sectionsList().map(([num,name]) => {
    const qs = questionsData.filter(q => q.section === num);
    const c = qs.filter(q => state.answers[q.id] === q.answer).length;
    const a = qs.filter(q => state.answers.hasOwnProperty(q.id)).length;
    return `<tr class="border-b border-slate-100 dark:border-slate-700 last:border-0">
      <td class="py-1.5 pr-2 text-slate-600 dark:text-slate-300">${name}</td>
      <td class="py-1.5 text-right whitespace-nowrap font-medium text-slate-700 dark:text-slate-200">${c}/${qs.length} <span class="text-slate-400 dark:text-slate-500 font-normal">(${a} dijawab)</span></td>
    </tr>`;
  }).join('');

  els.resultWrongList.innerHTML = wrongIds.length === 0
    ? '<span class="text-xs text-slate-400 dark:text-slate-500">Tidak ada soal yang salah. Mantap!</span>'
    : wrongIds.map(id => `<button data-id="${id}" class="wrong-jump text-xs px-2.5 py-1 rounded-md bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-300 border border-rose-200 dark:border-rose-800 hover:bg-rose-100 dark:hover:bg-rose-900 font-medium">${id}</button>`).join('');

  els.resultWrongList.querySelectorAll('.wrong-jump').forEach(btn => {
    btn.addEventListener('click', () => { jumpToNumber(+btn.dataset.id); closeResultModal(); });
  });

  els.overlay.classList.remove('hidden');
}
function closeResultModal(){ els.overlay.classList.add('hidden'); }

// ---------- Timer ----------
let tickCount = 0;
setInterval(() => {
  state.elapsed++;
  els.timer.textContent = fmtTime(state.elapsed);
  tickCount++;
  if(tickCount % 5 === 0) saveState();
}, 1000);

// ---------- Event listeners ----------
els.prevBtn.addEventListener('click', () => navigate(-1));
els.nextBtn.addEventListener('click', () => navigate(1));
els.sectionSelect.addEventListener('change', e => { state.filterSection = e.target.value; renderAll(); });
els.statusSelect.addEventListener('change', e => { state.filterStatus = e.target.value; renderAll(); });
els.jumpBtn.addEventListener('click', () => { const n = +els.jumpInput.value; if(n) jumpToNumber(n); });
els.jumpInput.addEventListener('keydown', e => { if(e.key === 'Enter'){ const n = +els.jumpInput.value; if(n) jumpToNumber(n); } });
els.shuffleBtn.addEventListener('click', toggleShuffle);
els.bookmarkBtn.addEventListener('click', toggleBookmark);
els.resetBtn.addEventListener('click', resetQuiz);
els.darkToggle.addEventListener('click', toggleDark);
els.resultBtn.addEventListener('click', openResultModal);
els.resultClose.addEventListener('click', closeResultModal);
els.resultClose2.addEventListener('click', closeResultModal);
els.overlay.addEventListener('click', e => { if(e.target === els.overlay) closeResultModal(); });
els.resultRestart.addEventListener('click', resetQuiz);

document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName;
  if(tag === 'INPUT' || tag === 'SELECT') return;
  if(e.key === 'ArrowRight') navigate(1);
  else if(e.key === 'ArrowLeft') navigate(-1);
  else if(['1','2','3','4','5','6'].includes(e.key)){
    const q = currentQuestion();
    const idx = +e.key - 1;
    if(q && !state.answers.hasOwnProperty(q.id) && idx < q.options.length) selectOption(q.id, idx);
  } else if(e.key.toLowerCase() === 'b') toggleBookmark();
});

// ---------- Init ----------
(function init(){
  renderMeta();
  document.documentElement.classList.toggle('dark', !!state.dark);
  els.shuffleLabel.textContent = state.shuffled ? "Urutan Asli" : "Acak Urutan Soal";
  els.timer.textContent = fmtTime(state.elapsed);
  renderSectionSelect();
  renderAll();
  if(!storageAvailable){
    console.warn('localStorage tidak tersedia di lingkungan ini — progres hanya tersimpan sementara di memori selama tab dibuka.');
  }
})();
</script>
</body>
</html>
